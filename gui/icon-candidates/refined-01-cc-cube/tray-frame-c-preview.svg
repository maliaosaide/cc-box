<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" role="img" aria-label="CC-Box frame C tray icon preview">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1040" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#ECFEFF"/>
    </linearGradient>
  </defs>
  <rect width="1040" height="420" rx="32" fill="url(#page)"/>
  <text x="48" y="64" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#0F172A">frame-c 配套托盘图标</text>
  <text x="48" y="100" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">与 app-frame-c 保持同一套渐变背景、内发光、六边容器和中心盒子。</text>

  <g transform="translate(48 142)">
